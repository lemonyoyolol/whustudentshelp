<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHUSH – Project</title><link rel="stylesheet" href="styles.css"></head><body><script src="script.js"></script><script>renderCommon('projects')</script>
<main class="site project-detail" id="detail"></main><script>
const slug=new URLSearchParams(location.search).get('project')||'learning-spaces';
const p=projects.find(x=>x.slug===slug)||projects[0];
document.title='WHUSH – '+p.title;
const gallery=(p.images&&p.images.length?p.images:(p.img?[p.img]:[]));
const index=projects.findIndex(x=>x.slug===p.slug);
const prevProject=projects[(index-1+projects.length)%projects.length];
const nextProject=projects[(index+1)%projects.length];
const carouselControls = gallery.length>1 ? `<button class="carousel-arrow carousel-prev" type="button" aria-label="Previous photo"><span>‹</span></button><button class="carousel-arrow carousel-next" type="button" aria-label="Next photo"><span>›</span></button>` : '';
const mediaSection = gallery.length ? `<section class="project-carousel ${gallery.length===1?'single-photo':''}" aria-label="${p.title} photos"><div class="carousel-track">${gallery.map((img,i)=>`<div class="carousel-slide"><img class="detail-hero" src="${img}" alt="${p.title} photo ${i+1}"></div>`).join('')}</div>${carouselControls}</section>` : '';
detail.innerHTML=`<div class="top"><div><div class="eyebrow">WHUSH PROJECT</div><h1>${p.title}</h1><p class="lead project-subtitle">${p.short}</p></div>${p.year?`<div class="meta">${p.year}</div>`:''}</div>${mediaSection}<section class="text-grid"><h2>About the project</h2><div><p>${p.desc}</p></div></section><div class="project-nav all-project-actions"><a class="outline-gradient-btn" href="project.html?project=${prevProject.slug}"><span>← Previous project</span></a><a class="outline-gradient-btn" href="projects.html"><span>Back to projects</span></a><a class="outline-gradient-btn" href="project.html?project=${nextProject.slug}"><span>Next project →</span></a></div>`;
const track=document.querySelector('.carousel-track');
const slides=[...document.querySelectorAll('.carousel-track .carousel-slide')];
let current=0;
function goTo(index){
  current=(index+slides.length)%slides.length;
  track.scrollTo({left:slides[current].offsetLeft,behavior:'smooth'});
}
if(slides.length>1){
  document.querySelector('.carousel-prev').addEventListener('click',()=>goTo(current-1));
  document.querySelector('.carousel-next').addEventListener('click',()=>goTo(current+1));
}
let auto=slides.length>1 ? setInterval(()=>goTo(current+1),10000) : null;
track.addEventListener('scroll',()=>{
  window.clearTimeout(track._snapTimer);
  track._snapTimer=window.setTimeout(()=>{
    const left=track.scrollLeft;
    current=slides.reduce((best,slide,i)=>Math.abs(slide.offsetLeft-left)<Math.abs(slides[best].offsetLeft-left)?i:best,0);
  },120);
},{passive:true});
track.addEventListener('pointerdown',()=>{if(auto){clearInterval(auto);auto=setInterval(()=>goTo(current+1),10000);}});
</script></body></html>
